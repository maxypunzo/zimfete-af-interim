<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Open account', 'clients', ~{::section})}">
<section>
  <h1 th:text="'Open asset finance account — ' + ${client.fullName}"></h1>
  <p class="sub">The $50 opening fee can be paid in parts; the account becomes active once it is fully paid.
    Projects (assets) can be added now or later, and an account can carry more than one.</p>
  <form method="post" th:action="@{/clients/{id}/open-account(id=${client.id})}">
    <fieldset th:object="${form}"><legend>Account</legend>
      <div class="form-grid">
        <div><label>Date opened</label><input type="date" th:field="*{openedDate}" required></div>
        <div><label>Opened by (clerk)</label><input th:field="*{openedBy}"></div>
        <div><label>Account no (blank = generate)</label><input th:field="*{accountNo}" placeholder="e.g. MRE2641ME"></div>
        <div><label>Opening fee paid today ($, of $50)</label><input type="number" step="0.01" min="0" max="50" th:field="*{openingFeeAmount}"></div>
        <div><label>Opening fee receipt no</label><input th:field="*{openingReceiptNo}" placeholder="blank = auto"></div>
        <div><label>Payment method</label><select th:field="*{paymentMethod}"><option th:each="p : ${paymentMethods}" th:value="${p}" th:text="${p}"></option></select></div>
      </div>
    </fieldset>
    <fieldset th:object="${project}"><legend>First project (optional)</legend>
      <div class="form-grid">
        <div><label>Asset type</label><select th:field="*{assetType}"><option value="">- not yet known -</option>
          <option th:each="t : ${assetTypes}" th:value="${t}" th:text="${t.label}"></option></select></div>
        <div><label>Description</label><input th:field="*{assetDescription}"></div>
        <div><label>Supplier</label><input th:field="*{supplier}"></div>
        <div><label>Quotation / project cost ($)</label><input type="number" step="0.01" min="0" th:field="*{quotationCost}"></div>
        <div><label>Minimum deposit %</label><input type="number" step="0.01" min="0" max="100" th:field="*{minDepositPercent}"></div>
        <div><label>Target start date</label><input type="date" th:field="*{targetDate}"></div>
        <div><label>First deposit today ($)</label><input type="number" step="0.01" min="0" th:field="*{initialDeposit}"></div>
        <div><label>Deposit receipt no</label><input th:field="*{depositReceiptNo}" placeholder="blank = auto"></div>
      </div>
    </fieldset>
    <div class="actions"><button type="submit" class="orange">Open account</button><a class="btn alt" th:href="@{/clients/{id}(id=${client.id})}">Cancel</a></div>
  </form>
</section>
</html>
