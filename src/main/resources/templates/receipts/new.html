<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Receipt', 'receipt', ~{::section})}">
<section>
  <h1>Receipt a payment</h1>
  <p class="sub">Joining fee, subscriptions, deposits and loan repayments. ($50 account opening is done from the member's page with "Open account".)</p>
  <form method="post" th:action="@{/receipts/new}" th:object="${form}">
    <input type="hidden" th:field="*{memberId}">
    <fieldset><legend>Who paid</legend>
      <div th:if="${member != null}">
        <p><strong th:text="${member.fullName}"></strong> — <span th:text="${member.memberNo}"></span>, ID <span th:text="${member.nationalId}"></span>
          <a class="btn sm alt" th:href="@{/receipts/new}">change</a></p>
        <div class="form-grid" th:if="${!#lists.isEmpty(memberAccounts)}">
          <div><label>Asset finance account (for deposits / repayments)</label>
            <select th:field="*{accountId}"><option value="">- none -</option>
              <option th:each="a : ${memberAccounts}" th:value="${a.id}"
                      th:text="${a.accountNo} + ' · ' + (${a.assetType} != null ? ${a.assetType.label} : 'asset not set') + ' · ' + ${a.status.label}"></option></select></div>
        </div>
      </div>
      <div th:if="${member == null}" class="form-grid">
        <div><label>Member no, national ID or account no</label><input name="lookup" th:value="${param.lookup}" autofocus required></div>
        <div class="muted" style="align-self:end">Not registered yet? <a th:href="@{/members/new}">Register the member</a> — fees are receipted there.</div>
      </div>
    </fieldset>
    <fieldset><legend>Payment</legend>
      <div class="form-grid">
        <div><label>For</label><select th:field="*{type}" required><option value="">- choose -</option>
          <option th:each="t : ${types}" th:value="${t}" th:text="${t.label} + (${t.standardAmount} != null ? ' ($' + ${t.standardAmount} + ')' : '')"></option></select></div>
        <div><label>Amount ($)</label><input type="number" step="0.01" min="0.01" th:field="*{amount}" required></div>
        <div><label>Months (subscriptions only)</label><input type="number" min="1" th:field="*{months}" placeholder="from amount"></div>
        <div><label>Date</label><input type="date" th:field="*{receiptDate}" required></div>
        <div><label>Branch</label><select th:field="*{branchId}"><option value="">(member's branch)</option>
          <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.label}"></option></select></div>
        <div><label>Receipt book no</label><input th:field="*{receiptNo}" placeholder="blank = auto"></div>
        <div><label>Payment method</label><select th:field="*{paymentMethod}"><option th:each="p : ${paymentMethods}" th:value="${p}" th:text="${p}"></option></select></div>
        <div><label>Reference (EcoCash / bank ref)</label><input th:field="*{reference}"></div>
        <div><label>Captured by</label><input th:field="*{capturedBy}"></div>
        <div><label>Description / payer (other income)</label><input th:field="*{description}"></div>
      </div>
    </fieldset>
    <div class="actions"><button type="submit" class="orange">Save receipt</button></div>
  </form>
</section>
</html>
