<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Receipts', 'receipts', ~{::section})}">
<section>
  <h1>Receipts</h1>
  <form class="inline card" method="get" th:action="@{/receipts}">
    <div><label>From</label><input type="date" name="from" th:value="${from}"></div>
    <div><label>To</label><input type="date" name="to" th:value="${to}"></div>
    <div><label>Branch</label><select th:replace="~{fragments :: branchFilter(${branchId}, 'All branches')}"></select></div>
    <div><label>Type</label><select name="type"><option value="">All types</option>
      <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}" th:selected="${t == type}"></option></select></div>
    <button type="submit">Show</button>
    <a class="btn orange" th:href="@{/receipts/new}">+ Receipt</a>
  </form>
  <div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Receipt</th><th>Branch</th><th>Type</th><th>Paid by</th><th>Account</th><th class="r">Amount</th><th>Method</th><th>Captured by</th><th>Source</th></tr></thead>
    <tbody>
    <tr th:each="r : ${receipts}" th:classappend="${r.reversed} ? 'reversed'">
      <td th:text="${#temporals.format(r.receiptDate, 'dd/MM/yyyy')}"></td>
      <td><a th:href="@{/receipts/{id}(id=${r.id})}" th:text="${r.receiptNo}"></a></td>
      <td th:text="${r.branch.name}"></td>
      <td th:text="${r.type.label}"></td>
      <td th:text="${r.payerName}"></td>
      <td th:text="${r.project != null ? r.project.label : (r.account != null ? r.account.accountNo : '')}"></td>
      <td class="r" th:text="${#numbers.formatDecimal(r.amount, 1, 'COMMA', 2, 'POINT')}"></td>
      <td th:text="${r.paymentMethod}"></td>
      <td th:text="${r.capturedBy}"></td>
      <td th:text="${r.source}"></td>
    </tr>
    <tr class="total"><td colspan="6">Total (excluding reversed)</td><td class="r" th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></td><td colspan="3"></td></tr>
    </tbody>
  </table></div>
</section>
</html>
