<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Open account', 'members', ~{::section})}">
<section>
  <h1 th:text="'Open asset finance account — ' + ${member.fullName}"></h1>
  <p class="sub">Receipts the $50 account opening fee and generates the account number. Asset details can be added now or later.</p>
  <form method="post" th:action="@{/members/{id}/open-account(id=${member.id})}" th:object="${form}">
    <fieldset><legend>Account</legend>
      <div class="form-grid">
        <div><label>Date opened</label><input type="date" th:field="*{openedDate}" required></div>
        <div><label>Opened by (clerk)</label><input th:field="*{openedBy}"></div>
        <div><label>Account no (blank = generate)</label><input th:field="*{accountNo}"></div>
        <div><label>Opening fee receipt no</label><input th:field="*{openingReceiptNo}" placeholder="blank = auto"></div>
        <div><label>Payment method</label><select th:field="*{paymentMethod}"><option th:each="p : ${paymentMethods}" th:value="${p}" th:text="${p}"></option></select></div>
      </div>
    </fieldset>
    <fieldset><legend>Asset / project</legend>
      <div class="form-grid">
        <div><label>Asset type</label><select th:field="*{assetType}"><option value="">- not yet known -</option>
          <option th:each="t : ${assetTypes}" th:value="${t}" th:text="${t.label}"></option></select></div>
        <div><label>Asset description</label><input th:field="*{assetDescription}"></div>
        <div><label>Supplier</label><input th:field="*{supplier}"></div>
        <div><label>Quotation cost ($)</label><input type="number" step="0.01" min="0" th:field="*{quotationCost}"></div>
        <div><label>Minimum deposit %</label><input type="number" step="0.01" min="0" max="100" th:field="*{minDepositPercent}"></div>
        <div><label>Target start date</label><input type="date" th:field="*{targetDate}"></div>
        <div><label>Repayment months (planned)</label><input type="number" min="1" th:field="*{repaymentMonths}"></div>
        <div><label>First deposit today ($)</label><input type="number" step="0.01" min="0" th:field="*{initialDeposit}"></div>
        <div><label>Deposit receipt no</label><input th:field="*{depositReceiptNo}" placeholder="blank = auto"></div>
      </div>
      <div style="margin-top:10px"><label>Notes</label><textarea th:field="*{notes}" rows="2"></textarea></div>
    </fieldset>
    <div class="actions"><button type="submit" class="orange">Open account</button><a class="btn alt" th:href="@{/members/{id}(id=${member.id})}">Cancel</a></div>
  </form>
</section>
</html>
