<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('New member', 'members', ~{::section})}">
<section>
  <h1>Register a new member</h1>
  <p class="sub">One save does it all: the member goes into the clients database, the fees are receipted, the account
    (if opened) gets its number, and the daily / monthly reports pick everything up.</p>
  <form method="post" th:action="@{/members/new}" th:object="${form}">
    <fieldset><legend>Member details</legend>
      <div class="form-grid">
        <div><label>Branch</label><select th:field="*{branchId}"><option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.label}"></option></select></div>
        <div><label>Date joined</label><input type="date" th:field="*{dateJoined}" required></div>
        <div><label>First name(s)</label><input th:field="*{firstName}" required></div>
        <div><label>Surname</label><input th:field="*{surname}" required></div>
        <div><label>National ID</label><input th:field="*{nationalId}" placeholder="63-123456A75" required></div>
        <div><label>Gender</label><select th:field="*{gender}"><option value="">-</option><option value="Female">Female</option><option value="Male">Male</option></select></div>
        <div><label>Phone</label><input th:field="*{phone}"></div>
        <div><label>Village</label><input th:field="*{village}"></div>
        <div><label>Ward</label><input th:field="*{ward}"></div>
        <div><label>District (blank = branch district)</label><input th:field="*{district}"></div>
        <div><label>Next of kin</label><input th:field="*{nextOfKin}"></div>
        <div><label>Captured by</label><input th:field="*{capturedBy}"></div>
      </div>
      <div style="margin-top:10px"><label>Notes</label><textarea th:field="*{notes}" rows="2"></textarea></div>
    </fieldset>

    <fieldset><legend>Paid today</legend>
      <div class="form-grid">
        <div><label><input type="checkbox" th:field="*{payJoiningFee}"> Joining fee $10</label>
          <input th:field="*{joiningReceiptNo}" placeholder="Receipt book no (blank = auto)"></div>
        <div><label>Subscription months paid ($1/month)</label><input type="number" min="0" th:field="*{subsMonths}">
          <input th:field="*{subsReceiptNo}" placeholder="Receipt book no (blank = auto)" style="margin-top:4px"></div>
        <div><label>Payment method</label><select th:field="*{paymentMethod}"><option th:each="p : ${paymentMethods}" th:value="${p}" th:text="${p}"></option></select></div>
      </div>
    </fieldset>

    <fieldset><legend><label style="display:inline"><input type="checkbox" th:field="*{openAccount}"> Also open an asset finance account ($50)</label></legend>
      <div class="form-grid">
        <div><label>Account no (blank = generate)</label><input th:field="*{account.accountNo}"></div>
        <div><label>Opening fee receipt no</label><input th:field="*{account.openingReceiptNo}" placeholder="blank = auto"></div>
        <div><label>Asset type</label><select th:field="*{account.assetType}"><option value="">- not yet known -</option>
          <option th:each="t : ${assetTypes}" th:value="${t}" th:text="${t.label}"></option></select></div>
        <div><label>Asset description</label><input th:field="*{account.assetDescription}" placeholder="e.g. 40m borehole + 1.5kW solar pump"></div>
        <div><label>Supplier</label><input th:field="*{account.supplier}"></div>
        <div><label>Quotation cost ($)</label><input type="number" step="0.01" min="0" th:field="*{account.quotationCost}"></div>
        <div><label>Minimum deposit %</label><input type="number" step="0.01" min="0" max="100" th:field="*{account.minDepositPercent}"></div>
        <div><label>Target start date</label><input type="date" th:field="*{account.targetDate}"></div>
        <div><label>Repayment months (planned)</label><input type="number" min="1" th:field="*{account.repaymentMonths}"></div>
        <div><label>First deposit today ($)</label><input type="number" step="0.01" min="0" th:field="*{account.initialDeposit}"></div>
        <div><label>Deposit receipt no</label><input th:field="*{account.depositReceiptNo}" placeholder="blank = auto"></div>
      </div>
    </fieldset>
    <div class="actions"><button type="submit" class="orange">Save member and receipts</button><a class="btn alt" th:href="@{/members}">Cancel</a></div>
  </form>
</section>
</html>
