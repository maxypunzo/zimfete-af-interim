<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${a.numberLabel}, 'register', ~{::section})}">
<section>
  <h1 th:text="${a.numberLabel} + ' — ' + ${a.client.fullName}"></h1>
  <p class="sub"><a th:href="@{/clients/{id}(id=${a.client.id})}" th:text="${a.client.clientNo}"></a>
    · <span th:text="${a.branch.label}"></span> · <span th:text="${a.client.phone}"></span>
    · <span th:text="${a.client.saccoMember} ? 'SACCO member (' + ${a.client.category.label} + ')' : 'Not a SACCO member'"></span></p>

  <div class="actions">
    <a class="btn orange" th:if="${!a.closed}" th:href="@{/accounts/{id}/projects/new(id=${a.id})}">+ Add project</a>
    <a class="btn" th:if="${!a.active and !a.closed}" th:href="@{/receipts/new(accountId=${a.id}, type='ACCOUNT_OPENING')}"
       th:text="'Receipt opening fee balance ($' + ${a.openingFeeBalance} + ')'"></a>
  </div>

  <div class="card"><dl class="kv">
    <dt>Status</dt><dd th:text="${a.statusLabel}" th:classappend="${!a.active} ? 'red'"></dd>
    <dt>Opened</dt><dd th:text="(${a.openedDate} != null ? ${#temporals.format(a.openedDate, 'dd MMM yyyy')} : 'Date not recorded') + ' by ' + (${a.openedBy} ?: 'not recorded')"></dd>
    <dt>Opening fee paid</dt><dd th:text="'$' + ${a.openingFeePaid} + ' of $50' + (${a.activatedDate} != null ? ' (complete ' + ${#temporals.format(a.activatedDate, 'dd MMM yyyy')} + ')' : '')"></dd>
    <dt>Notes</dt><dd style="white-space:pre-line" th:text="${a.notes} ?: '-'"></dd>
  </dl></div>

  <h2>Projects on this account</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>Asset</th><th class="r">Cost</th><th class="r">Deposited</th><th>Progress</th><th>Status</th><th>Approved</th><th>Started</th><th class="r">Loan balance</th><th></th></tr></thead>
    <tbody>
    <tr th:each="p : ${projects}">
      <td><a th:href="@{/projects/{id}(id=${p.id})}" th:text="${p.assetLabel}"></a></td>
      <td class="r" th:text="${p.quotationCost != null ? #numbers.formatDecimal(p.quotationCost, 1, 'COMMA', 2, 'POINT') : '-'}"></td>
      <td class="r" th:text="${#numbers.formatDecimal(p.totalDeposited, 1, 'COMMA', 2, 'POINT')}"></td>
      <td><div th:replace="~{fragments :: progress(${p})}"></div></td>
      <td><span th:replace="~{fragments :: status(${p})}"></span></td>
      <td th:text="${p.approvedDate != null ? #temporals.format(p.approvedDate, 'dd/MM/yyyy') : ''}"></td>
      <td th:text="${p.projectStartDate != null ? #temporals.format(p.projectStartDate, 'dd/MM/yyyy') : ''}"></td>
      <td class="r" th:text="${p.loanBalance != null ? #numbers.formatDecimal(p.loanBalance, 1, 'COMMA', 2, 'POINT') : '-'}"></td>
      <td><a class="btn sm" th:if="${p.status.preStart or p.loanStarted}" th:href="@{/receipts/new(projectId=${p.id})}" th:text="${p.loanStarted} ? 'Repayment' : 'Deposit'"></a></td>
    </tr>
    <tr th:if="${#lists.isEmpty(projects)}"><td colspan="9" class="muted">No project yet. Add one when the client knows what asset they want.</td></tr>
    </tbody>
  </table></div>

  <h2>Account statement</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Receipt</th><th>Type</th><th>Project</th><th class="r">Amount</th><th>Method</th><th>Captured by</th></tr></thead>
    <tbody>
    <tr th:each="r : ${receipts}" th:classappend="${r.reversed} ? 'reversed'">
      <td th:text="${#temporals.format(r.receiptDate, 'dd/MM/yyyy')}"></td>
      <td><a th:href="@{/receipts/{id}(id=${r.id})}" th:text="${r.receiptNo}"></a></td>
      <td th:text="${r.type.label}"></td>
      <td th:text="${r.project != null ? r.project.assetLabel : ''}"></td>
      <td class="r" th:text="${#numbers.formatDecimal(r.amount, 1, 'COMMA', 2, 'POINT')}"></td>
      <td th:text="${r.paymentMethod}"></td>
      <td th:text="${r.capturedBy}"></td>
    </tr>
    </tbody>
  </table></div>

  <form th:if="${!a.closed}" class="inline card" style="margin-top:20px" method="post" th:action="@{/accounts/{id}/close(id=${a.id})}"
        onsubmit="return confirm('Close this account?')">
    <div style="flex:1"><label>Close account — reason</label><input name="reason"></div>
    <button type="submit" class="danger">Close account</button>
  </form>
</section>
</html>
