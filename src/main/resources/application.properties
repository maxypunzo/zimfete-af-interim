spring.application.name=zimfete-asset-finance
server.port=8080

# Data lives in a single file next to the jar (./data/afs.mv.db). Back up that folder (or use
# Reports > Export master register) regularly.
spring.datasource.url=jdbc:h2:file:./data/afs;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Harare

spring.mvc.format.date=iso
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false
java.awt.headless=true

# ---- ZimFete settings -------------------------------------------------------
# Login for the system. CHANGE THE PASSWORD before real use.
afs.login.username=afm
afs.login.password=zimfete2026
# Name stamped on receipts, accounts opened and reports you capture yourself.
afs.officer-name=Acting AFM (HQ)
